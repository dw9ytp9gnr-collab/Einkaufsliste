<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8f5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Einkauf">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png">
<title>Einkaufsliste</title>
<style>
:root{--bg:#f4f6f2;--card:#fff;--ink:#19251f;--muted:#758079;--green:#237a50;--pale:#e5f2e9;--line:#e8ece8;--shadow:0 8px 28px #243a2b0a;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}.wrap{max-width:520px;margin:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(28px + var(--safe))}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 18px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--green)}h1{font-size:29px;letter-spacing:-.04em;margin:3px 0 0}.date{font-size:13px;color:var(--muted);background:#fff;padding:8px 11px;border-radius:99px;white-space:nowrap}.progress-card{background:linear-gradient(120deg,#1f7048,#2c9561);color:white;border-radius:22px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}.prog-row{display:flex;justify-content:space-between;font-size:14px;font-weight:650}.track{height:6px;background:#ffffff45;border-radius:9px;margin-top:11px;overflow:hidden}.fill{height:100%;background:#fff;border-radius:9px;width:0;transition:width .2s}.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:13px;margin-bottom:13px}.list-controls{display:flex;gap:7px;align-items:center;margin-bottom:13px}.list-controls select{flex:1;min-width:0;height:43px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink);padding:0 10px;font-size:14px;font-weight:650}.icon-btn{flex:0 0 42px;height:42px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--green);font-size:18px;display:grid;place-items:center}.icon-btn:active,.chip:active,.add-btn:active{transform:scale(.96)}.quick-title{font-size:12px;color:var(--muted);font-weight:700;margin:0 2px 8px}.chips{display:flex;gap:7px;overflow-x:auto;padding:0 1px 3px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid #d9e9de;background:#f5faf6;color:#286e49;border-radius:99px;padding:8px 11px;font-size:13px;font-weight:650}.add-row{display:flex;gap:8px}.add-row input{min-width:0;flex:1;border:1px solid var(--line);background:#f8faf8;border-radius:14px;padding:0 12px;height:46px;font-size:16px;outline:none}.add-row input:focus,.qty-input:focus{border-color:#83bd99;box-shadow:0 0 0 3px #e5f2e9}.voice-btn{width:43px;height:46px;border:1px solid var(--line);background:white;border-radius:13px;color:var(--green);font-size:19px}.voice-btn.listening{background:#fff0ee;color:#c64232;border-color:#efb5ad;animation:pulse 1s infinite alternate}@keyframes pulse{to{box-shadow:0 0 0 5px #c6423220}}.add-btn{border:0;border-radius:14px;background:var(--green);color:#fff;font-size:24px;font-weight:400;width:48px;height:46px}.add-options{display:flex;gap:8px;margin-top:9px}.add-options select,.qty-input{height:38px;border:1px solid var(--line);border-radius:12px;background:white;color:#59645d;padding:0 9px;font-size:13px;min-width:0}.add-options select{flex:1}.qty-input{width:148px}.incoming{display:none;background:#edf7ef;border:1px solid #cfe5d5;padding:13px 14px;border-radius:16px;margin-bottom:13px}.incoming.show{display:block}.incoming p{font-size:13px;margin:0 0 10px}.incoming-actions{display:flex;gap:8px}.incoming-actions button{border:0;border-radius:10px;padding:9px 12px;background:var(--green);color:white;font-weight:650}.incoming-actions .secondary{background:white;color:var(--green);border:1px solid var(--line)}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 3px 8px}.toolbar strong{font-size:15px}.text-btn{border:0;background:none;color:var(--green);font-size:12px;font-weight:650;padding:7px 3px}.empty{text-align:center;color:var(--muted);padding:28px 12px 23px}.empty .basket{font-size:33px;margin-bottom:5px}.empty strong{display:block;color:var(--ink);margin-bottom:3px}.group{margin-top:6px}.group-title{padding:8px 4px 5px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;display:flex;justify-content:space-between}.item{display:flex;align-items:center;min-height:52px;border-bottom:1px solid var(--line);gap:10px}.item:last-child{border-bottom:0}.check{appearance:none;flex:0 0 23px;width:23px;height:23px;border:1.8px solid #cbd4cd;border-radius:8px;margin:0;display:grid;place-items:center}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:'✓';color:white;font-size:15px;font-weight:800}.item-label{font-size:15px;flex:1;min-width:0;overflow-wrap:anywhere}.qty{color:var(--muted);font-size:12px;white-space:nowrap}.item.done .item-label{text-decoration:line-through;color:#98a29b}.item.done{opacity:.83}.del{border:0;background:transparent;color:#aab2ad;font-size:20px;padding:7px 4px 7px 8px;line-height:1}.notice{text-align:center;color:var(--muted);font-size:11px;margin:13px 0 3px}.toast{position:fixed;left:50%;bottom:calc(18px + var(--safe));transform:translate(-50%,20px);background:#202a23;color:#fff;border-radius:99px;padding:11px 17px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:360px){.wrap{padding-left:14px;padding-right:14px}.date{font-size:12px;padding:7px 9px}.qty-input{width:125px}h1{font-size:27px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><div class="eyebrow">Dein Einkauf</div><h1>Einkaufsliste</h1></div><div class="date" id="date"></div></header>
<section class="progress-card" aria-live="polite"><div class="prog-row"><span id="progressText">Noch nichts auf der Liste</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<div class="list-controls"><select id="listSelect" aria-label="Einkaufsliste auswählen"></select><button class="icon-btn" id="newList" title="Neue Liste" aria-label="Neue Liste">＋</button><button class="icon-btn" id="renameList" title="Liste umbenennen" aria-label="Liste umbenennen">✎</button><button class="icon-btn" id="deleteList" title="Liste löschen" aria-label="Liste löschen">⌫</button><button class="icon-btn" id="shareList" title="Liste teilen" aria-label="Liste teilen">↗</button></div>
<section class="incoming" id="incoming"><p id="incomingText">Du hast eine geteilte Liste erhalten.</p><div class="incoming-actions"><button id="importList">Als neue Liste übernehmen</button><button class="secondary" id="dismissImport">Ignorieren</button></div></section>
<section class="card"><div class="quick-title">Häufig gebraucht · antippen zum Hinzufügen</div><div class="chips" id="quickAdds"></div></section>
<section class="card"><form id="form"><div class="add-row"><input id="name" maxlength="80" placeholder="Was brauchst du?" autocomplete="off" aria-label="Artikel hinzufügen"><button type="button" class="voice-btn" id="voice" aria-label="Spracheingabe" title="Spracheingabe">🎙</button><button class="add-btn" aria-label="Hinzufügen">+</button></div><div class="add-options"><select id="category" aria-label="Kategorie"><option>Obst & Gemüse</option><option>Brot & Backwaren</option><option>Kühlregal</option><option>Fisch & Fleisch</option><option>Vorrat</option><option>Getränke</option><option>Haushalt</option><option>Sonstiges</option></select><input id="quantity" class="qty-input" maxlength="24" placeholder="Menge / Einheit" aria-label="Menge und Einheit"></div></form></section>
<section class="card"><div class="toolbar"><strong id="listTitle">Deine Liste</strong><button class="text-btn" id="clearDone" type="button">Erledigte löschen</button></div><div id="items"></div></section>
<div class="notice">Listen werden auf diesem Gerät gespeichert. Teilen übergibt eine Momentaufnahme.</div>
</main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
const KEY='einkaufsliste-se-v1',cats=['Obst & Gemüse','Brot & Backwaren','Kühlregal','Fisch & Fleisch','Vorrat','Getränke','Haushalt','Sonstiges'];
const presets=[['Milch','Kühlregal'],['Eier','Kühlregal'],['Haferflocken','Vorrat'],['Äpfel','Obst & Gemüse'],['Brot','Brot & Backwaren'],['Bananen','Obst & Gemüse']];
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}
if(Array.isArray(state)){state={activeId:'main',lists:{main:{name:'Einkauf',items:state.map(x=>({...x,category:x.category||x.cat||'Sonstiges'}))}}}}
if(!state||!state.lists){state={activeId:'main',lists:{main:{name:'Einkauf',items:[]}}}}
if(!Object.keys(state.lists).length)state={activeId:'main',lists:{main:{name:'Einkauf',items:[]}}};if(!state.lists[state.activeId])state.activeId=Object.keys(state.lists)[0];
let incoming=null;try{const m=location.hash.match(/(?:^#|&)share=([^&]+)/);if(m){const raw=decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))));incoming=JSON.parse(raw);history.replaceState(null,'',location.pathname+location.search)}}catch{}
const current=()=>state.lists[state.activeId];function persist(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
function guessCategory(n){let s=n.toLocaleLowerCase('de');if(/apfel|banane|tomat|salat|gurk|zwiebel|kartoff|obst|gemüse|paprika|brokkoli|spinat|beere/.test(s))return 'Obst & Gemüse';if(/brot|bröt|toast|back/.test(s))return 'Brot & Backwaren';if(/milch|käse|joghurt|quark|butter|ei\b|eier/.test(s))return 'Kühlregal';if(/fisch|lachs|fleisch|hähn|huhn|rind/.test(s))return 'Fisch & Fleisch';if(/wasser|saft|kaffee|tee|getränk/.test(s))return 'Getränke';return 'Vorrat'}
function addItem(name,cat,quantity=''){name=name.trim();if(!name)return;current().items.push({id:Date.now()+Math.random(),name,category:cat||guessCategory(name),quantity,done:false});persist()}
function render(){const l=current(),items=l.items||[],total=items.length,done=items.filter(x=>x.done).length,p=total?Math.round(done/total*100):0;
$('#progressText').textContent=total?`${done} von ${total} erledigt`:'Noch nichts auf der Liste';$('#percent').textContent=p+'%';$('#fill').style.width=p+'%';$('#listTitle').textContent=`${l.name} · ${total}`;
const sel=$('#listSelect');sel.innerHTML=Object.entries(state.lists).map(([id,x])=>`<option value="${esc(id)}" ${id===state.activeId?'selected':''}>${esc(x.name)} (${x.items.length})</option>`).join('');
$('#clearDone').style.visibility=done?'visible':'hidden';$('#deleteList').disabled=Object.keys(state.lists).length===1;$('#deleteList').style.opacity=$('#deleteList').disabled?'.4':'1';
if(!total){$('#items').innerHTML='<div class="empty"><div class="basket">🛒</div><strong>Deine Liste ist noch leer</strong>Füge oben einen Artikel hinzu oder nutze die Schnellzugriffe.</div>';return}
const pending=items.filter(x=>!x.done),checked=items.filter(x=>x.done);function rows(arr){return arr.map(x=>`<div class="item ${x.done?'done':''}"><input class="check" type="checkbox" aria-label="${x.done?'Erledigt':'Als erledigt markieren'}: ${esc(x.name)}" data-check="${x.id}" ${x.done?'checked':''}><span class="item-label">${esc(x.name)}</span>${x.quantity?`<span class="qty">${esc(x.quantity)}</span>`:''}<button class="del" aria-label="${esc(x.name)} löschen" data-del="${x.id}">×</button></div>`).join('')}
const groups=cats.map(c=>[c,pending.filter(x=>x.category===c)]).filter(([,a])=>a.length);const unknown=pending.filter(x=>!cats.includes(x.category));if(unknown.length)groups.push(['Sonstiges',unknown]);let html=groups.map(([c,a])=>`<div class="group"><div class="group-title"><span>${esc(c)}</span><span>${a.length}</span></div>${rows(a)}</div>`).join('');if(checked.length)html+=`<div class="group"><div class="group-title"><span>Erledigt</span><span>${checked.length}</span></div>${rows(checked)}</div>`;$('#items').innerHTML=html
}
$('#quickAdds').innerHTML=presets.map(([n,c])=>`<button type="button" class="chip" data-quick="${esc(n)}" data-cat="${esc(c)}">＋ ${esc(n)}</button>`).join('');$('#quickAdds').addEventListener('click',e=>{const b=e.target.closest('[data-quick]');if(b){addItem(b.dataset.quick,b.dataset.cat);toast(`${b.dataset.quick} hinzugefügt`)}});
$('#form').addEventListener('submit',e=>{e.preventDefault();const n=$('#name').value.trim();if(!n){$('#name').focus();return}addItem(n,$('#category').value,$('#quantity').value.trim());$('#name').value='';$('#quantity').value='';$('#name').focus()});
$('#items').addEventListener('change',e=>{if(e.target.matches('[data-check]')){const x=current().items.find(i=>String(i.id)===e.target.dataset.check);if(x){x.done=e.target.checked;persist()}}});$('#items').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(b){current().items=current().items.filter(i=>String(i.id)!==b.dataset.del);persist()}});$('#clearDone').addEventListener('click',()=>{current().items=current().items.filter(i=>!i.done);persist();toast('Erledigte Artikel gelöscht')});
$('#listSelect').addEventListener('change',e=>{state.activeId=e.target.value;persist()});$('#newList').addEventListener('click',()=>{const n=prompt('Wie soll die neue Liste heißen?','Wocheneinkauf');if(n&&n.trim()){const id='l'+Date.now();state.lists[id]={name:n.trim().slice(0,32),items:[]};state.activeId=id;persist();toast('Neue Liste angelegt')}});$('#renameList').addEventListener('click',()=>{const n=prompt('Liste umbenennen:',current().name);if(n&&n.trim()){current().name=n.trim().slice(0,32);persist();toast('Liste umbenannt')}});$('#deleteList').addEventListener('click',()=>{if(Object.keys(state.lists).length<2){toast('Die letzte Liste kann nicht gelöscht werden');return}if(confirm(`Liste „${current().name}“ löschen?`)){delete state.lists[state.activeId];state.activeId=Object.keys(state.lists)[0];persist();toast('Liste gelöscht')}});
function enc(obj){return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
$('#shareList').addEventListener('click',async()=>{const l=current();if(!l.items.length){toast('Diese Liste ist noch leer');return}const base=location.href.split('#')[0],payload=enc({version:1,name:l.name,items:l.items}),url=`${base}#share=${payload}`;const summary=l.items.map(x=>`• ${x.name}${x.quantity?' — '+x.quantity:''}${x.done?' ✓':''}`).join('\n');const data={title:`Einkaufsliste: ${l.name}`,text:`Einkaufsliste „${l.name}“\n${summary}`,url};if(url.length<7000)data.text+=`\n\nZum Übernehmen öffnen: ${url}`;try{if(navigator.share){await navigator.share(data);return}if(navigator.clipboard&&url.length<7000){await navigator.clipboard.writeText(url);toast('Teile-Link kopiert');return}await navigator.clipboard.writeText(data.text);toast('Einkaufsliste kopiert')}catch(e){if(e.name!=='AbortError')toast('Teilen ist auf diesem Gerät nicht verfügbar')}});
$('#importList').addEventListener('click',()=>{if(!incoming||!Array.isArray(incoming.items))return;let name=(incoming.name||'Geteilte Liste').trim().slice(0,28)||'Geteilte Liste';if(Object.values(state.lists).some(x=>x.name===name))name+=' (geteilt)';const id='l'+Date.now();state.lists[id]={name,items:incoming.items.map(x=>({id:Date.now()+Math.random(),name:String(x.name||'Artikel'),category:cats.includes(x.category)?x.category:guessCategory(x.name||''),quantity:String(x.quantity||''),done:!!x.done}))};state.activeId=id;incoming=null;$('#incoming').classList.remove('show');persist();toast('Geteilte Liste übernommen')});$('#dismissImport').addEventListener('click',()=>{$('#incoming').classList.remove('show');incoming=null});
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;const voice=$('#voice');if(!Speech){voice.addEventListener('click',()=>toast('Spracheingabe wird in diesem Browser nicht unterstützt'))}else{voice.addEventListener('click',()=>{const rec=new Speech();rec.lang='de-DE';rec.interimResults=false;voice.classList.add('listening');voice.textContent='●';rec.onresult=e=>{const phrase=e.results[0][0].transcript.trim();const names=phrase.split(/,|\bund\b|\n/i).map(x=>x.trim()).filter(Boolean);if(names.length>1){names.forEach(n=>addItem(n,guessCategory(n)));toast(`${names.length} Artikel erkannt`)}else{$('#name').value=phrase;$('#category').value=guessCategory(phrase);$('#name').focus();toast('Erkannt – Menge ergänzen und hinzufügen')}};rec.onerror=()=>toast('Spracheingabe konnte nicht gestartet werden');rec.onend=()=>{voice.classList.remove('listening');voice.textContent='🎙'};try{rec.start()}catch{voice.classList.remove('listening');voice.textContent='🎙';toast('Mikrofon gerade nicht verfügbar')}})}
$('#date').textContent=new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'numeric',month:'short'}).format(new Date());render();if(incoming&&Array.isArray(incoming.items)){$('#incomingText').textContent=`Geteilte Liste „${incoming.name||'Einkaufsliste'}“ mit ${incoming.items.length} Artikeln empfangen.`;$('#incoming').classList.add('show')}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
